name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Lint + typecheck + tests unitaires + build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # scripts/prisma.mjs (postinstall) requires DATABASE_URL; CI uses a throw-away SQLite file.
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:push
      - run: npm run build
        env:
          SESSION_SECRET: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Tests de bout en bout (chromium + mobile + axe)
    runs-on: ubuntu-latest
    needs: qa
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: para
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: para
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U para
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://para@localhost:5432/para?schema=public
      SESSION_SECRET: ${{ secrets.GITHUB_TOKEN }}
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:push
      - run: npm run build
      - run: npx playwright test
        env:
          CI: "1"

  docker:
    name: Image Docker (standalone + healthcheck)
    runs-on: ubuntu-latest
    needs: qa
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: thiqti-ma:ci
      - name: Smoke test health endpoint
        run: |
          docker run -d --name thiqti \
            -p 3000:3000 \
            -e DATABASE_URL="file:./data/ci.db" \
            -e SESSION_SECRET="${{ secrets.GITHUB_TOKEN }}" \
            thiqti-ma:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "HEALTH OK"
              exit 0
            fi
            sleep 2
          done
          docker logs thiqti || true
          echo "HEALTH TIMEOUT" && exit 1
