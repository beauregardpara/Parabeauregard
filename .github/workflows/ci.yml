name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Lint + typecheck + tests unitaires + build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # scripts/prisma.mjs (postinstall) requires DATABASE_URL; CI uses a throw-away SQLite file.
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:push
      - run: npm run build
        env:
          SESSION_SECRET: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: Tests de bout en bout (chromium + mobile + axe)
    runs-on: ubuntu-latest
    needs: qa
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: para
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: para
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U para"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://para@localhost:5432/para?schema=public
      SESSION_SECRET: ${{ secrets.GITHUB_TOKEN }}
      NODE_ENV: test
      # Comptes de la base jetable de CI uniquement (jamais utilisés ailleurs).
      SEED_ADMIN_PASSWORD: ci-only-${{ github.run_id }}-superadmin
      SEED_CATALOG_PASSWORD: ci-only-${{ github.run_id }}-catalogue
      # Les tests E2E envoient une adresse X-Forwarded-For distincte par test pour ne
      # pas partager la limite de connexions admin (voir e2e/fixtures/admin-login.ts).
      TRUSTED_PROXY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:push
      - name: Seed deterministic CI catalogue (synthetic data only)
        run: |
          npm run db:seed
          npx tsx e2e/fixtures/seed-ci.ts
      - run: npm run build
      - run: npx playwright test
        env:
          CI: "1"

  docker:
    name: Image Docker (standalone + healthcheck)
    runs-on: ubuntu-latest
    needs: qa
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: para
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: para
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U para"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://para@127.0.0.1:5432/para?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare throw-away PostgreSQL with synthetic data
        run: |
          npm ci
          npm run db:push
          npm run db:seed
          npx tsx e2e/fixtures/seed-ci.ts
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: para-beauregard:ci
      - name: Smoke test (boot, health with database, real pages)
        shell: bash
        run: |
          docker run -d --name para-smoke --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            para-beauregard:ci
          ok=""
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/api/health -o health.json; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then docker logs para-smoke || true; echo "HEALTH TIMEOUT"; exit 1; fi
          node -e 'const h=require("./health.json"); console.log(JSON.stringify({status:h.status,database:h.database,products:h.counts&&h.counts.products})); if(h.database!=="ok"||!(h.counts&&h.counts.products>0)) process.exit(1)'
          for path in / /recherche?q=creme /produits/guinot-longue-vie-creme-jeunesse-revitalisante-visage-homme-50-ml /admin/login; do
            code=$(curl -s -o page.html -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path -> $code"
            test "$code" = "200"
          done
          # Write to a file first: piping into `grep -q` makes curl fail with SIGPIPE (exit 23) under pipefail.
          curl -s -o product.html "http://127.0.0.1:3000/produits/guinot-longue-vie-creme-jeunesse-revitalisante-visage-homme-50-ml"
          grep -q "Guinot" product.html
          echo "SMOKE OK"
      - name: Container logs on failure
        if: failure()
        run: docker logs para-smoke || true
