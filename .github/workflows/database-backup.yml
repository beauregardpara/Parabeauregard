name: Production database and storage backup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: PostgreSQL + Supabase Storage backup (with isolated restore test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      restore-db:
        # Isolated, throw-away PostgreSQL used ONLY for the restore test.
        image: postgres:17
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: restore
          POSTGRES_DB: restore
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DIRECT_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_BACKUP_BUCKET: database-backups
      SUPABASE_STORAGE_BACKUP_BUCKET: product-images
      BACKUP_RETENTION_DAYS: "14"
      RESTORE_DB_URL: postgresql://restore:restore@localhost:5433/restore
      OUT: artifacts/backup-output
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL 17 client tools
        shell: bash
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install --yes -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Describe API key shape (no secret values)
        shell: bash
        run: |
          node -e '
            const k = process.env.SUPABASE_SECRET_KEY || "";
            console.log(JSON.stringify({
              length: k.length,
              startsWithSbSecret: k.startsWith("sb_secret_"),
              startsWithSbPublishable: k.startsWith("sb_publishable_"),
              startsWithJwt: k.startsWith("eyJ"),
              leadingWhitespace: /^\s/.test(k),
              trailingWhitespace: /\s$/.test(k),
              innerWhitespace: /\S\s+\S/.test(k),
              hasQuotes: /["\x27]/.test(k),
              looksLikeUrl: /^https?:/.test(k),
              looksLikeEnvAssignment: /^[A-Z_]+=/.test(k),
              containsSbSecretLater: k.indexOf("sb_secret_") > 0,
            }));
          '

      - name: Validate required secret presence and shape (no values printed)
        shell: bash
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "SUPABASE_DB_URL secret is missing"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL secret is missing"; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo "SUPABASE_SECRET_KEY secret is missing"; exit 1; }
          case "$SUPABASE_URL" in https://*.supabase.co|https://*.supabase.co/) echo "SUPABASE_URL shape: ok";; *) echo "SUPABASE_URL must be https://<project-ref>.supabase.co"; exit 1;; esac
          case "$SUPABASE_SECRET_KEY" in sb_secret_*) echo "SUPABASE_SECRET_KEY shape: sb_secret_ key";; eyJ*) echo "SUPABASE_SECRET_KEY shape: legacy JWT key";; *) echo "SUPABASE_SECRET_KEY does not look like a Supabase secret key"; exit 1;; esac
          case "$SUPABASE_DB_URL" in sb_secret_*|sb_publishable_*|eyJ*) echo "SUPABASE_DB_URL contains an API key instead of a PostgreSQL URL"; exit 1;; esac
          pg_dump --version

      - name: Describe database connection (no secret values)
        shell: bash
        run: |
          node -e '
            const raw = process.env.SUPABASE_DB_URL || "";
            const shape = {
              length: raw.length,
              startsWithPostgresScheme: /^postgres(ql)?:\/\//.test(raw),
              hasQuotes: /["\x27]/.test(raw),
              hasWhitespaceOrNewline: /\s/.test(raw),
              looksLikeEnvAssignment: /^[A-Z_]+=/.test(raw),
              hasPasswordPlaceholder: /YOUR-PASSWORD/i.test(raw),
              atSignCount: (raw.match(/@/g) || []).length,
            };
            let u;
            try { u = new URL(raw); } catch {
              console.log(JSON.stringify({ validUrl: false, ...shape }));
              console.log("SUPABASE_DB_URL is not a valid PostgreSQL URL. Re-enter it (raw value, no quotes/prefix, URL-encoded password).");
              process.exit(1);
            }
            const host = u.hostname;
            const kind = /\.pooler\.supabase\.com$/.test(host) ? "supavisor-pooler" : /^db\..+\.supabase\.co$/.test(host) ? "direct-db-host (IPv6-only on Supabase)" : "other";
            if (shape.hasPasswordPlaceholder) { console.log(JSON.stringify({ validUrl: true, ...shape })); console.log("SUPABASE_DB_URL still contains the [YOUR-PASSWORD] placeholder."); process.exit(1); }
            console.log(JSON.stringify({ validUrl: true, ...shape, scheme: u.protocol, hostKind: kind, port: u.port || "5432", hasPassword: Boolean(u.password), userHasProjectRef: u.username.includes("."), sslmode: u.searchParams.get("sslmode") }));
          '

      - name: Record live row counts (read-only)
        id: live
        shell: bash
        run: |
          set -euo pipefail
          redact() { sed -E 's/"[^"]*"/"<redacted>"/g; s/\(([0-9a-fA-F:.]+)\)/(<ip>)/g'; }
          q() { psql "$SUPABASE_DB_URL" -X -At -v ON_ERROR_STOP=1 -c "$1" 2> >(redact >&2); }
          products=$(q 'SELECT count(*) FROM public."Product"')
          categories=$(q 'SELECT count(*) FROM public."Category"')
          images=$(q 'SELECT count(*) FROM public."ProductImage"')
          brands=$(q "SELECT count(DISTINCT brand) FROM public.\"Product\" WHERE brand IS NOT NULL AND brand <> ''")
          echo "products=$products" >> "$GITHUB_OUTPUT"
          echo "categories=$categories" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "brands=$brands" >> "$GITHUB_OUTPUT"
          echo "Live counts: products=$products brands=$brands categories=$categories productImages=$images"

      - name: Create PostgreSQL dump
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="$OUT/para-beauregard-production.dump"
          test -s "$OUT/para-beauregard-production.dump"
          echo "Dump size: $(stat -c %s "$OUT/para-beauregard-production.dump") bytes"

      - name: Restore dump into isolated PostgreSQL (never production)
        shell: bash
        run: |
          set -uo pipefail
          case "$RESTORE_DB_URL" in *@localhost:5433/*) ;; *) echo "Restore target is not the isolated service DB"; exit 1;; esac
          pg_restore --dbname="$RESTORE_DB_URL" --schema=public --no-owner --no-privileges \
            "$OUT/para-beauregard-production.dump" 2> restore-errors.log
          status=$?
          echo "pg_restore exit code: $status (non-zero can be caused by Supabase-only objects; verified below)"
          grep -c '^pg_restore: error' restore-errors.log || true
          rm -f restore-errors.log

      - name: Install dependencies (Prisma client for restore verification)
        run: npm ci --no-audit --no-fund
        env:
          DATABASE_URL: ${{ env.RESTORE_DB_URL }}
          DIRECT_URL: ""

      - name: Verify restored data with Prisma
        run: node scripts/verify-restored-backup.mjs
        env:
          DATABASE_URL: ${{ env.RESTORE_DB_URL }}
          DIRECT_URL: ""
          EXPECTED_PRODUCTS: ${{ steps.live.outputs.products }}
          EXPECTED_BRANDS: ${{ steps.live.outputs.brands }}
          EXPECTED_CATEGORIES: ${{ steps.live.outputs.categories }}
          EXPECTED_PRODUCT_IMAGES: ${{ steps.live.outputs.images }}

      - name: Export Supabase product images (read-only)
        id: storage
        run: node scripts/backup-supabase-storage.mjs
        env:
          STORAGE_BACKUP_OUTPUT: artifacts/storage-backup
          STORAGE_BACKUP_MANIFEST: artifacts/backup-output/product-images-manifest.json

      - name: Archive product images and test extraction
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$OUT/product-images.tar.gz" -C artifacts/storage-backup .
          archived=$(tar -tzf "$OUT/product-images.tar.gz" | grep -vc '/$' || true)
          expected="${{ steps.storage.outputs.objects }}"
          tmp=$(mktemp -d)
          tar -xzf "$OUT/product-images.tar.gz" -C "$tmp"
          extracted=$(find "$tmp" -type f | wc -l)
          rm -rf "$tmp"
          echo "Storage objects: listed=$expected archived=$archived extracted=$extracted"
          test "$archived" = "$expected"
          test "$extracted" = "$expected"
          (cd "$OUT" && sha256sum para-beauregard-production.dump product-images.tar.gz > SHA256SUMS)

      - name: Secondary copy to private Supabase bucket
        # Primary backup is the private GitHub artifact below; this copy needs
        # the private "database-backups" bucket to exist.
        continue-on-error: true
        run: node scripts/backup-postgres-remote.mjs

      - name: Upload private GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: para-beauregard-production-backup-${{ github.run_id }}
          path: artifacts/backup-output
          if-no-files-found: error
          retention-days: 14
